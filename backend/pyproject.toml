[project]
name = "mentee-bot-backend"
version = "0.1.0"
description = "FastAPI service for the Mentee bot"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.141.1",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "httpx>=0.28",
  "authlib>=1.8.0,<2",
  "joserfc>=1.7.5",
  "cryptography>=50.0.1",
  "sqlmodel>=0.0.47",
  # SQLModel 0.0.47 requires SQLAlchemy <2.1; keep its latest supported 2.0.x.
  "sqlalchemy>=2.0.49,<2.1",
  "asyncpg>=0.30",
  "alembic>=1.20.0",
  "psycopg2-binary>=2.9.13",
  "greenlet>=3.5.6",
  "logfire[fastapi,httpx]>=5.1.1",
  "pydantic-ai>=2.51.0",
  "openai>=3.19.2",
  "perplexityai>=0.43.6",
  "slowapi>=0.1.10",
  "sendgrid>=6.11",
  "posthog>=7.60.1",
  "pypdf>=6.19.0",
  "python-docx>=1.2.0",
  "boto3>=1.43.103",
]

[dependency-groups]
dev = [
  "ruff>=0.16.9",
  "pytest>=9.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# System prompts are prose; long prose lines are more readable than wrapped.
"app/agents/mentee/prompts.py" = ["E501"]
# Eval corpora are data: each entry is a one-line EvalPrompt(...) row whose
# natural-language `prompt` string is inherently long. Wrapping hurts diff
# readability and these scripts are offline tooling — not on the request path.
"scripts/eval_prompts*.py" = ["E501"]
"scripts/eval_run*.py" = ["E501"]
"scripts/eval_score*.py" = ["E501"]
# Same rationale for the pydantic-evals dataset — each Case carries a
# natural-language `message` whose wrapping would hurt review readability.
"tests/evals/dataset.py" = ["E501"]
# Evaluator rubrics are LLM prompts; wrapping them mid-sentence hurts the
# judge's reading more than the code reviewer's.
"tests/evals/evaluators.py" = ["E501"]

[tool.pytest.ini_options]
markers = [
    "eval: end-to-end evaluation against live LLM APIs (slow, costs money)",
]
testpaths = ["tests"]
